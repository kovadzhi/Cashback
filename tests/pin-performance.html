<!doctype html><meta charset="utf-8"><title>Профиль пинов</title><style>body{font:14px system-ui}iframe{width:375px;height:812px;border:0}pre{white-space:pre-wrap}</style><h1>Профиль карты и шторки</h1><button id="run">Измерить 9 сценариев</button><pre id="status">Готово</pre><pre id="report"></pre><iframe id="live"></iframe><script>
const frame=document.querySelector('#live'),status=document.querySelector('#status'),report=document.querySelector('#report');
document.querySelector('#run').onclick=async()=>{report.textContent='';for(const width of [320,375,390])for(const zoom of [10,12,14]){status.textContent=`${width} px / zoom ${zoom}`;frame.style.width=width+'px';frame.style.height=(width===320?568:812)+'px';const version='current',base=new URL('../',location.href).href;const html=await(await fetch(base+'index.html?perf='+Date.now(),{cache:'no-store'})).text();frame.srcdoc=html.replace('<head>','<head><base href="'+base+'">').replace('</body>','<script src="tests/pin-performance.js?v=20261105-performance"><'+'/script></body>');await new Promise(resolve=>frame.onload=resolve);const result=await frame.contentWindow.measurePins(zoom);const row=document.createElement('div');row.textContent=JSON.stringify({version,width,zoom,...result});report.append(row);}status.textContent='Завершено';};
</script>
